<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Void Run v2 (prototype)</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07070f; font-family: system-ui, sans-serif; color: #dff; }
  #hud { position: fixed; top: 12px; left: 14px; font-size: 15px; line-height: 1.6; text-shadow: 0 1px 3px #000; pointer-events: none; }
  #toast { position: fixed; top: 14%; left: 50%; transform: translateX(-50%); font-size: 18px; text-shadow: 0 1px 4px #000; opacity: 0; transition: opacity .4s; pointer-events: none; }
  #msg { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; background: rgba(0,0,0,.6); cursor: pointer; }
  #msg div { max-width: 460px; padding: 24px; }
  h1 { margin: 0 0 8px; font-size: 28px; }
  p { margin: 6px 0; opacity: .85; }
</style>
</head>
<body>
<div id="hud"></div>
<div id="toast"></div>
<div id="msg"><div>
  <h1>Void Run</h1>
  <p id="msgtext">Collect every gem, then reach the beacon.</p>
  <p>Class: <b id="clsname">Runner</b> &nbsp;(press 1 Runner · 2 Hopper · 3 Dasher)</p>
  <p>WASD move &nbsp;·&nbsp; Space jump &nbsp;·&nbsp; Shift dash (Dasher) &nbsp;·&nbsp; Mouse look</p>
  <p>Blue platforms slide, orange ones crumble, red blocks hurt, glowing pillars give boons.</p>
  <p><b>Click to play</b></p>
</div></div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

/* ---------- helpers ---------- */
function makeRng(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- renderer / scene ---------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07070f);
scene.fog = new THREE.Fog(0x07070f, 25, 95);

const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 250);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x8899ff, 0x110022, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(10, 25, 8);
scene.add(sun);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ---------- classes and boons (plain data: easy to extend) ---------- */
const CLASSES = [
  { name: 'Runner', speed: 1.2, jump: 1.0, airJumps: 0, dash: false },
  { name: 'Hopper', speed: 1.0, jump: 1.0, airJumps: 1, dash: false },
  { name: 'Dasher', speed: 1.0, jump: 1.0, airJumps: 0, dash: true }
];
let cls = CLASSES[0];

const run = { speedMul: 1, jumpMul: 1, lives: 0, magnet: 1.2 };
function resetRun() { run.speedMul = 1; run.jumpMul = 1; run.lives = 0; run.magnet = 1.2; }

const BOONS = [
  { name: 'Swift: +10% speed', apply: () => { run.speedMul += 0.1; } },
  { name: 'Spring: +8% jump', apply: () => { run.jumpMul += 0.08; } },
  { name: 'Second Chance: +1 life', apply: () => { run.lives += 1; } },
  { name: 'Magnet: wider gem pickup', apply: () => { run.magnet += 0.6; } }
];

/* ---------- game state ---------- */
let seed = Math.floor(Math.random() * 1e9);
let level = 1, deaths = 0, best = 1;
let collected = 0, totalGems = 0;
let group = null;
const solids = [];     // platforms: { c, h, mesh, dead, move?, crumble?, timer?, fall? }
const kills = [];      // hazard boxes: { c, h }
const gems = [];
const altars = [];
let beacon = null;
let lowestY = 0;
let clock = 0;

const toastEl = document.getElementById('toast');
let toastT = 0;
function toast(t) {
  toastEl.textContent = t;
  toastEl.style.opacity = 1;
  clearTimeout(toastT);
  toastT = setTimeout(() => { toastEl.style.opacity = 0; }, 2600);
}

/* ---------- level generation ---------- */
function addPlatform(cx, cy, cz, sx, sy, sz, color) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(sx, sy, sz),
    new THREE.MeshStandardMaterial({ color, roughness: 0.85 })
  );
  mesh.position.set(cx, cy, cz);
  group.add(mesh);
  const s = { c: new THREE.Vector3(cx, cy, cz), h: new THREE.Vector3(sx / 2, sy / 2, sz / 2), mesh, dead: false };
  solids.push(s);
  return s;
}

function buildLevel() {
  if (group) scene.remove(group);
  group = new THREE.Group();
  scene.add(group);
  solids.length = 0; kills.length = 0; gems.length = 0; altars.length = 0;
  collected = 0;

  const r = makeRng(seed + level * 1013);
  const count = 8 + level * 3;
  const color = new THREE.Color().setHSL((level * 0.13) % 1, 0.45, 0.42);

  let x = 0, y = 0, z = 0, heading = 0, prevHalf = 3;
  const tops = [];

  addPlatform(x, y - 0.5, z, 6, 1, 6, color);
  tops.push({ x, y, z, s: null });
  lowestY = 0;

  for (let i = 1; i <= count; i++) {
    const last = i === count;
    const size = last ? 6 : Math.max(1.8, 3.6 - level * 0.15 - r() * 1.2);
    const gap = Math.min(4.2, 2 + r() * 1.2 + level * 0.15);
    heading = clamp(heading + (r() - 0.5) * 1.3, -1.1, 1.1);
    const dist = prevHalf + gap + size / 2;
    x += Math.sin(heading) * dist;
    z += Math.cos(heading) * dist;
    y += (r() - 0.4) * 2.2;

    const s = addPlatform(x, y - 0.5, z, size, 1, size, color);
    const perp = new THREE.Vector3(Math.cos(heading), 0, -Math.sin(heading));

    // special platforms appear from level 2 on
    if (!last && i > 1 && level >= 2) {
      const t = r();
      if (t < 0.16 && size >= 2.4) {
        s.mesh.material.color.setHex(0x4aa3ff);
        s.move = { base: s.c.clone(), perp, amp: 1.8, speed: 0.9 + r() * 0.6, phase: r() * 6.28 };
      } else if (t < 0.34) {
        s.mesh.material.color.setHex(0xc9743a);
        s.crumble = true;
        s.timer = -1;
      } else if (t < 0.5 && size >= 3) {
        const off = perp.clone().multiplyScalar(size / 2 - 0.55);   // spike sits at the side so a path stays open
        const sp = new THREE.Mesh(
          new THREE.BoxGeometry(0.9, 0.8, 0.9),
          new THREE.MeshStandardMaterial({ color: 0xff4455, emissive: 0x660011 })
        );
        sp.position.set(x + off.x, y + 0.4, z + off.z);
        group.add(sp);
        kills.push({ c: sp.position.clone(), h: new THREE.Vector3(0.45, 0.4, 0.45) });
      }
    }

    // altar every 5th platform (never on a moving one)
    if (!last && i % 5 === 0 && !s.move) {
      const altar = new THREE.Mesh(
        new THREE.CylinderGeometry(0.45, 0.6, 1.4, 12),
        new THREE.MeshStandardMaterial({ color: 0xb98cff, emissive: 0x5a2fb0, emissiveIntensity: 0.9 })
      );
      altar.position.set(x, y + 0.7, z);
      group.add(altar);
      altars.push({ mesh: altar, used: false });
    }

    tops.push({ x, y, z, s });
    lowestY = Math.min(lowestY, y);
    prevHalf = size / 2;
  }

  // gems: any middle platform that isn't moving and has no altar
  const pool = [];
  for (let i = 1; i < tops.length - 1; i++) {
    if (tops[i].s && tops[i].s.move) continue;
    if (i % 5 === 0) continue;
    pool.push(i);
  }
  totalGems = Math.min(3 + level, pool.length);
  for (let g = 0; g < totalGems; g++) {
    const idx = pool.splice(Math.floor(r() * pool.length), 1)[0];
    const t = tops[idx];
    const mesh = new THREE.Mesh(
      new THREE.OctahedronGeometry(0.4),
      new THREE.MeshStandardMaterial({ color: 0xffd45e, emissive: 0xaa7700, emissiveIntensity: 0.8 })
    );
    mesh.position.set(t.x, t.y + 1.2, t.z);
    group.add(mesh);
    gems.push({ mesh, taken: false });
  }

  // beacon
  const end = tops[tops.length - 1];
  const bmesh = new THREE.Mesh(
    new THREE.CylinderGeometry(0.5, 0.5, 14, 16, 1, true),
    new THREE.MeshBasicMaterial({ color: 0x555566, transparent: true, opacity: 0.45, side: THREE.DoubleSide })
  );
  bmesh.position.set(end.x, end.y + 7, end.z);
  group.add(bmesh);
  beacon = { mesh: bmesh, pos: new THREE.Vector3(end.x, end.y, end.z) };

  respawn();
}

function respawn() {
  player.pos.set(0, 1.2, 0);
  player.vel.set(0, 0, 0);
  player.ground = null;
  player.dashT = 0;
}

/* ---------- player ---------- */
const HALF = new THREE.Vector3(0.35, 0.9, 0.35);
const player = {
  pos: new THREE.Vector3(), vel: new THREE.Vector3(),
  onGround: false, ground: null, coyote: 0, jumpBuffer: 0,
  airJumps: 0, dashT: 0, dashCd: 0, dashDir: new THREE.Vector3()
};
const facing = new THREE.Vector3(0, 0, -1);

const body = new THREE.Mesh(
  new THREE.BoxGeometry(0.7, 1.8, 0.7),
  new THREE.MeshStandardMaterial({ color: 0x66e0ff, roughness: 0.5 })
);
const visor = new THREE.Mesh(
  new THREE.BoxGeometry(0.5, 0.25, 0.1),
  new THREE.MeshStandardMaterial({ color: 0x111122 })
);
visor.position.set(0, 0.45, -0.36);
body.add(visor);
scene.add(body);

function overlaps(c, h) {
  return Math.abs(player.pos.x - c.x) < HALF.x + h.x &&
         Math.abs(player.pos.y - c.y) < HALF.y + h.y &&
         Math.abs(player.pos.z - c.z) < HALF.z + h.z;
}
function collides() {
  for (const s of solids) if (!s.dead && overlaps(s.c, s.h)) return s;
  return null;
}

function moveAxis(axis, d) {
  player.pos[axis] += d;
  const s = collides();
  if (!s) return;
  if (d > 0) player.pos[axis] = s.c[axis] - s.h[axis] - HALF[axis] - 0.001;
  else if (d < 0) player.pos[axis] = s.c[axis] + s.h[axis] + HALF[axis] + 0.001;
  if (axis === 'y') {
    if (d < 0) { player.onGround = true; player.ground = s; }
    player.vel.y = 0;
  } else {
    player.vel[axis] = 0;
  }
}

/* ---------- input ---------- */
const keys = {};
let playing = false;
const msg = document.getElementById('msg');
const msgtext = document.getElementById('msgtext');
const clsname = document.getElementById('clsname');

addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') { player.jumpBuffer = 0.12; e.preventDefault(); }
  if (!playing && /^Digit[1-3]$/.test(e.code)) {
    cls = CLASSES[Number(e.code.slice(5)) - 1];
    clsname.textContent = cls.name;
    resetRun();
    buildLevel();            // switching class restarts the level so boons don't carry over
  }
});
addEventListener('keyup', e => { keys[e.code] = false; });

let yaw = 0, pitch = 0.35;
msg.addEventListener('click', () => renderer.domElement.requestPointerLock());
document.addEventListener('pointerlockchange', () => {
  playing = document.pointerLockElement === renderer.domElement;
  msg.style.display = playing ? 'none' : 'grid';
});
document.addEventListener('mousemove', e => {
  if (!playing) return;
  yaw -= e.movementX * 0.0025;
  pitch = clamp(pitch + e.movementY * 0.0025, -0.2, 1.2);
});

/* ---------- game loop ---------- */
const hud = document.getElementById('hud');
const SPEED = 7, ACCEL = 40, JUMP = 9.5, GRAVITY = 26, DASH_SPEED = 18;
let last = performance.now();

function die() {
  if (run.lives > 0) {
    run.lives--;
    toast('Second Chance used');
    respawn();
    return;
  }
  deaths++;
  level = 1;
  seed = Math.floor(Math.random() * 1e9);
  resetRun();
  toast('You fell. New run, new world.');
  buildLevel();
}

function nextLevel() {
  level++;
  best = Math.max(best, level);
  toast('Level ' + level);
  buildLevel();
}

function updatePlatforms(dt) {
  clock += dt;
  for (const s of solids) {
    if (s.dead) {
      if (s.fall) {
        s.mesh.position.y -= 14 * dt;
        if (s.mesh.position.y < -200) { s.mesh.visible = false; s.fall = false; }
      }
      continue;
    }
    if (s.move) {
      const m = s.move;
      const off = Math.sin(clock * m.speed + m.phase) * m.amp;
      const nx = m.base.x + m.perp.x * off, nz = m.base.z + m.perp.z * off;
      const dx = nx - s.c.x, dz = nz - s.c.z;
      if (player.ground === s) { player.pos.x += dx; player.pos.z += dz; }   // carry the rider
      s.c.x = nx; s.c.z = nz;
      s.mesh.position.x = nx; s.mesh.position.z = nz;
    }
    if (s.crumble) {
      if (player.ground === s && s.timer < 0) s.timer = 0.6;
      if (s.timer >= 0) {
        s.timer -= dt;
        s.mesh.position.x += (Math.random() - 0.5) * 0.04;   // shake before it drops
        if (s.timer <= 0) { s.dead = true; s.fall = true; }
      }
    }
  }
}

function tick(now) {
  requestAnimationFrame(tick);
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;

  if (playing) {
    updatePlatforms(dt);

    const fx = -Math.sin(yaw), fz = -Math.cos(yaw);
    const rx = Math.cos(yaw), rz = -Math.sin(yaw);
    let ix = 0, iz = 0;
    if (keys.KeyW) { ix += fx; iz += fz; }
    if (keys.KeyS) { ix -= fx; iz -= fz; }
    if (keys.KeyD) { ix += rx; iz += rz; }
    if (keys.KeyA) { ix -= rx; iz -= rz; }
    const moving = ix !== 0 || iz !== 0;
    const len = Math.hypot(ix, iz) || 1;
    const top = SPEED * cls.speed * run.speedMul;
    const tx = moving ? (ix / len) * top : 0;
    const tz = moving ? (iz / len) * top : 0;
    if (moving) facing.set(ix / len, 0, iz / len);

    // dash (Dasher class)
    player.dashCd -= dt;
    if (cls.dash && (keys.ShiftLeft || keys.ShiftRight) && player.dashCd <= 0) {
      player.dashDir.copy(facing);
      player.dashT = 0.18;
      player.dashCd = 0.9;
    }

    if (player.dashT > 0) {
      player.dashT -= dt;
      player.vel.x = player.dashDir.x * DASH_SPEED;
      player.vel.z = player.dashDir.z * DASH_SPEED;
      player.vel.y = 0;                                  // no gravity while dashing
    } else {
      const a = ACCEL * dt;
      player.vel.x += clamp(tx - player.vel.x, -a, a);
      player.vel.z += clamp(tz - player.vel.z, -a, a);
      player.vel.y -= GRAVITY * dt;
    }

    // jump: coyote time + input buffer + optional air jumps
    player.coyote = player.onGround ? 0.1 : player.coyote - dt;
    if (player.onGround) player.airJumps = cls.airJumps;
    player.jumpBuffer -= dt;
    if (player.jumpBuffer > 0) {
      if (player.coyote > 0) {
        player.vel.y = JUMP * cls.jump * run.jumpMul;
        player.jumpBuffer = 0; player.coyote = 0;
      } else if (player.airJumps > 0) {
        player.vel.y = JUMP * 0.9 * cls.jump * run.jumpMul;
        player.airJumps--; player.jumpBuffer = 0;
      }
    }

    player.onGround = false;
    player.ground = null;
    moveAxis('x', player.vel.x * dt);
    moveAxis('z', player.vel.z * dt);
    moveAxis('y', player.vel.y * dt);

    if (moving) body.rotation.y = Math.atan2(-facing.x, -facing.z);

    // gems (with magnet radius)
    for (const g of gems) {
      if (g.taken) continue;
      if (g.mesh.position.distanceTo(player.pos) < run.magnet) {
        g.taken = true; g.mesh.visible = false; collected++;
      }
    }

    // altars: touch one for a random boon
    for (const al of altars) {
      if (al.used) continue;
      if (al.mesh.position.distanceTo(player.pos) < 1.4) {
        al.used = true;
        al.mesh.material.emissiveIntensity = 0.1;
        const boon = BOONS[Math.floor(Math.random() * BOONS.length)];
        boon.apply();
        toast('Altar boon: ' + boon.name);
      }
    }

    // hazards
    for (const k of kills) if (overlaps(k.c, k.h)) { die(); break; }

    // beacon
    const open = collected >= totalGems;
    beacon.mesh.material.color.set(open ? 0x66ffaa : 0x555566);
    beacon.mesh.material.opacity = open ? 0.6 : 0.35;
    const dx = player.pos.x - beacon.pos.x, dz = player.pos.z - beacon.pos.z;
    if (open && Math.hypot(dx, dz) < 1.6 && Math.abs(player.pos.y - beacon.pos.y - 0.9) < 2) nextLevel();

    if (player.pos.y < lowestY - 20) die();
  }

  for (const g of gems) g.mesh.rotation.y += dt * 2;
  for (const al of altars) if (!al.used) al.mesh.rotation.y += dt;

  body.position.copy(player.pos);
  const dist = 9;
  camera.position.set(
    player.pos.x + Math.sin(yaw) * Math.cos(pitch) * dist,
    player.pos.y + Math.sin(pitch) * dist + 1,
    player.pos.z + Math.cos(yaw) * Math.cos(pitch) * dist
  );
  camera.lookAt(player.pos.x, player.pos.y + 0.8, player.pos.z);

  hud.innerHTML = cls.name + ' &nbsp;·&nbsp; Level ' + level + ' &nbsp;·&nbsp; Gems ' + collected + '/' + totalGems +
                  '<br>Lives +' + run.lives + ' &nbsp;·&nbsp; Deaths ' + deaths + ' &nbsp;·&nbsp; Best level ' + best;
  renderer.render(scene, camera);
}

buildLevel();
requestAnimationFrame(tick);
</script>
</body>
</html>
