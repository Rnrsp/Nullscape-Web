<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Void Run (prototype)</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07070f; font-family: system-ui, sans-serif; color: #dff; }
  #hud { position: fixed; top: 12px; left: 14px; font-size: 15px; line-height: 1.6; text-shadow: 0 1px 3px #000; pointer-events: none; }
  #msg { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; background: rgba(0,0,0,.6); cursor: pointer; }
  #msg div { max-width: 420px; padding: 24px; }
  h1 { margin: 0 0 8px; font-size: 28px; }
  p { margin: 6px 0; opacity: .85; }
</style>
</head>
<body>
<div id="hud"></div>
<div id="msg"><div>
  <h1>Void Run</h1>
  <p id="msgtext">Collect every gem, then reach the beacon.</p>
  <p>WASD move &nbsp;·&nbsp; Space jump &nbsp;·&nbsp; Mouse look</p>
  <p><b>Click to play</b></p>
</div></div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

/* ---------- helpers ---------- */
// Seeded random numbers so a level can be rebuilt from its seed (handy for sharing runs / daily seeds)
function makeRng(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- renderer / scene ---------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07070f);
scene.fog = new THREE.Fog(0x07070f, 25, 95);

const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 250);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x8899ff, 0x110022, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(10, 25, 8);
scene.add(sun);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ---------- game state ---------- */
let seed = Math.floor(Math.random() * 1e9);
let level = 1;
let deaths = 0;
let best = 1;
let collected = 0;
let totalGems = 0;
let group = null;                 // holds everything belonging to the current level
const solids = [];                // collision boxes: { c: center, h: half-size }
const gems = [];                  // collectibles
let beacon = null;                // { mesh, pos }
let lowestY = 0;

/* ---------- level generation ---------- */
function addPlatform(cx, cy, cz, sx, sy, sz, color) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(sx, sy, sz),
    new THREE.MeshStandardMaterial({ color, roughness: 0.85 })
  );
  mesh.position.set(cx, cy, cz);
  group.add(mesh);
  solids.push({ c: new THREE.Vector3(cx, cy, cz), h: new THREE.Vector3(sx / 2, sy / 2, sz / 2) });
}

function buildLevel() {
  if (group) scene.remove(group);
  group = new THREE.Group();
  scene.add(group);
  solids.length = 0;
  gems.length = 0;
  collected = 0;

  const r = makeRng(seed + level * 1013);
  const count = 8 + level * 3;                       // platforms grow with level
  const color = new THREE.Color().setHSL((level * 0.13) % 1, 0.45, 0.42);

  let x = 0, y = 0, z = 0, heading = 0, prevHalf = 3;
  const tops = [];

  addPlatform(x, y - 0.5, z, 6, 1, 6, color);        // start platform
  tops.push({ x, y, z });
  lowestY = 0;

  for (let i = 1; i <= count; i++) {
    const last = i === count;
    const size = last ? 6 : Math.max(1.6, 3.6 - level * 0.15 - r() * 1.2);
    const gap = Math.min(4.2, 2 + r() * 1.2 + level * 0.15);   // gaps get harder, but capped to stay jumpable
    heading = clamp(heading + (r() - 0.5) * 1.3, -1.1, 1.1);   // path wanders but keeps heading forward
    const dist = prevHalf + gap + size / 2;
    x += Math.sin(heading) * dist;
    z += Math.cos(heading) * dist;
    y += (r() - 0.4) * 2.2;                                    // mostly climbs, sometimes drops
    addPlatform(x, y - 0.5, z, size, 1, size, color);
    tops.push({ x, y, z });
    lowestY = Math.min(lowestY, y);
    prevHalf = size / 2;
  }

  // gems on random middle platforms
  totalGems = Math.min(3 + level, count - 1);
  const pool = [];
  for (let i = 1; i < tops.length - 1; i++) pool.push(i);
  for (let g = 0; g < totalGems; g++) {
    const idx = pool.splice(Math.floor(r() * pool.length), 1)[0];
    const t = tops[idx];
    const mesh = new THREE.Mesh(
      new THREE.OctahedronGeometry(0.4),
      new THREE.MeshStandardMaterial({ color: 0xffd45e, emissive: 0xaa7700, emissiveIntensity: 0.8 })
    );
    mesh.position.set(t.x, t.y + 1.2, t.z);
    group.add(mesh);
    gems.push({ mesh, taken: false });
  }

  // beacon on the final platform
  const end = tops[tops.length - 1];
  const bmesh = new THREE.Mesh(
    new THREE.CylinderGeometry(0.5, 0.5, 14, 16, 1, true),
    new THREE.MeshBasicMaterial({ color: 0x555566, transparent: true, opacity: 0.45, side: THREE.DoubleSide })
  );
  bmesh.position.set(end.x, end.y + 7, end.z);
  group.add(bmesh);
  beacon = { mesh: bmesh, pos: new THREE.Vector3(end.x, end.y, end.z) };

  // reset player to start
  player.pos.set(0, 1.2, 0);
  player.vel.set(0, 0, 0);
}

/* ---------- player ---------- */
const HALF = new THREE.Vector3(0.35, 0.9, 0.35);
const player = { pos: new THREE.Vector3(), vel: new THREE.Vector3(), onGround: false, coyote: 0, jumpBuffer: 0 };

const body = new THREE.Mesh(
  new THREE.BoxGeometry(0.7, 1.8, 0.7),
  new THREE.MeshStandardMaterial({ color: 0x66e0ff, roughness: 0.5 })
);
const visor = new THREE.Mesh(
  new THREE.BoxGeometry(0.5, 0.25, 0.1),
  new THREE.MeshStandardMaterial({ color: 0x111122 })
);
visor.position.set(0, 0.45, -0.36);
body.add(visor);
scene.add(body);

function collides() {
  for (const s of solids) {
    if (Math.abs(player.pos.x - s.c.x) < HALF.x + s.h.x &&
        Math.abs(player.pos.y - s.c.y) < HALF.y + s.h.y &&
        Math.abs(player.pos.z - s.c.z) < HALF.z + s.h.z) return s;
  }
  return null;
}

// Move one axis at a time, then push the player out of whatever it hit.
function moveAxis(axis, d) {
  player.pos[axis] += d;
  const s = collides();
  if (!s) return;
  if (d > 0) player.pos[axis] = s.c[axis] - s.h[axis] - HALF[axis] - 0.001;
  else if (d < 0) player.pos[axis] = s.c[axis] + s.h[axis] + HALF[axis] + 0.001;
  if (axis === 'y') {
    if (d < 0) player.onGround = true;
    player.vel.y = 0;
  } else {
    player.vel[axis] = 0;
  }
}

/* ---------- input ---------- */
const keys = {};
addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'Space') { player.jumpBuffer = 0.12; e.preventDefault(); } });
addEventListener('keyup', e => { keys[e.code] = false; });

let yaw = 0, pitch = 0.35;
const msg = document.getElementById('msg');
const msgtext = document.getElementById('msgtext');
let playing = false;

msg.addEventListener('click', () => renderer.domElement.requestPointerLock());
document.addEventListener('pointerlockchange', () => {
  playing = document.pointerLockElement === renderer.domElement;
  msg.style.display = playing ? 'none' : 'grid';
});
document.addEventListener('mousemove', e => {
  if (!playing) return;
  yaw -= e.movementX * 0.0025;
  pitch = clamp(pitch + e.movementY * 0.0025, -0.2, 1.2);
});

/* ---------- game loop ---------- */
const hud = document.getElementById('hud');
const SPEED = 7, ACCEL = 40, JUMP = 9.5, GRAVITY = 26;
let last = performance.now();

function die() {
  deaths++;
  level = 1;                                  // roguelite: a fall ends the run and rerolls the world
  seed = Math.floor(Math.random() * 1e9);
  msgtext.textContent = 'You fell. New run, new world.';
  buildLevel();
}

function nextLevel() {
  level++;
  best = Math.max(best, level);
  msgtext.textContent = 'Level ' + level + '.';
  buildLevel();
}

function tick(now) {
  requestAnimationFrame(tick);
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;

  if (playing) {
    // camera-relative movement
    const fx = -Math.sin(yaw), fz = -Math.cos(yaw);
    const rx = Math.cos(yaw), rz = -Math.sin(yaw);
    let ix = 0, iz = 0;
    if (keys.KeyW) { ix += fx; iz += fz; }
    if (keys.KeyS) { ix -= fx; iz -= fz; }
    if (keys.KeyD) { ix += rx; iz += rz; }
    if (keys.KeyA) { ix -= rx; iz -= rz; }
    const len = Math.hypot(ix, iz) || 1;
    const tx = (ix / len) * SPEED * (ix || iz ? 1 : 0);
    const tz = (iz / len) * SPEED * (ix || iz ? 1 : 0);
    const a = ACCEL * dt;
    player.vel.x += clamp(tx - player.vel.x, -a, a);
    player.vel.z += clamp(tz - player.vel.z, -a, a);

    // jump with coyote time + input buffer (feels much better than raw "on ground" checks)
    player.coyote = player.onGround ? 0.1 : player.coyote - dt;
    player.jumpBuffer -= dt;
    if (player.jumpBuffer > 0 && player.coyote > 0) {
      player.vel.y = JUMP;
      player.jumpBuffer = 0;
      player.coyote = 0;
    }
    player.vel.y -= GRAVITY * dt;

    player.onGround = false;
    moveAxis('x', player.vel.x * dt);
    moveAxis('z', player.vel.z * dt);
    moveAxis('y', player.vel.y * dt);

    if (Math.hypot(ix, iz) > 0) body.rotation.y = Math.atan2(-player.vel.x, -player.vel.z);

    // gems
    for (const g of gems) {
      if (g.taken) continue;
      if (g.mesh.position.distanceTo(player.pos) < 1.2) {
        g.taken = true; g.mesh.visible = false; collected++;
      }
    }

    // beacon
    const open = collected >= totalGems;
    beacon.mesh.material.color.set(open ? 0x66ffaa : 0x555566);
    beacon.mesh.material.opacity = open ? 0.6 : 0.35;
    const dx = player.pos.x - beacon.pos.x, dz = player.pos.z - beacon.pos.z;
    if (open && Math.hypot(dx, dz) < 1.6 && Math.abs(player.pos.y - beacon.pos.y - 0.9) < 2) nextLevel();

    // fell off the world
    if (player.pos.y < lowestY - 20) die();
  }

  for (const g of gems) g.mesh.rotation.y += dt * 2;

  body.position.copy(player.pos);
  const dist = 9;
  camera.position.set(
    player.pos.x + Math.sin(yaw) * Math.cos(pitch) * dist,
    player.pos.y + Math.sin(pitch) * dist + 1,
    player.pos.z + Math.cos(yaw) * Math.cos(pitch) * dist
  );
  camera.lookAt(player.pos.x, player.pos.y + 0.8, player.pos.z);

  hud.innerHTML = 'Level ' + level + ' &nbsp;·&nbsp; Gems ' + collected + '/' + totalGems +
                  '<br>Deaths ' + deaths + ' &nbsp;·&nbsp; Best level ' + best;
  renderer.render(scene, camera);
}

buildLevel();
requestAnimationFrame(tick);
</script>
</body>
</html>
